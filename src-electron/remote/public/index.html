<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#0d1117" />
    <title>M³ Remote Control</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      :root {
        --bg-color: #0d1117;
        --card-bg: #161b22;
        --card-border: #30363d;
        --text-main: #f0f6fc;
        --text-muted: #8b949e;
        --primary: #1f6feb;
        --primary-hover: #388bfd;
        --primary-light: rgba(56, 139, 253, 0.15);
        --accent-green: #238636;
        --accent-red: #da3633;
        --accent-yellow: #d29922;
        --radius: 16px;
        --safe-bottom: env(safe-area-inset-bottom, 16px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica,
          Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      header {
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--card-border);
        background: rgba(22, 27, 34, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 1.1rem;
      }
      .brand svg {
        width: 28px;
        height: 28px;
        border-radius: 6px;
      }
      .status-badges {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        transition: all 0.3s ease;
      }
      .badge-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .connected .badge-dot {
        background-color: var(--accent-green);
        box-shadow: 0 0 8px var(--accent-green);
      }
      .reconnecting .badge-dot {
        background-color: var(--accent-yellow);
        box-shadow: 0 0 8px var(--accent-yellow);
      }
      .disconnected .badge-dot {
        background-color: var(--accent-red);
        box-shadow: 0 0 8px var(--accent-red);
      }
      .badge-blackout {
        cursor: pointer;
      }
      .badge-blackout.active {
        background: rgba(218, 54, 51, 0.2);
        border-color: var(--accent-red);
        color: #ff7b72;
      }
      .badge-blackout.visible {
        background: rgba(35, 134, 54, 0.2);
        border-color: var(--accent-green);
        color: #7ee787;
      }
      .badge-zoom-share {
        background: rgba(56, 139, 253, 0.2);
        border-color: rgba(56, 139, 253, 0.6);
        color: #79c0ff;
        cursor: pointer;
      }
      .badge-zoom-share:active {
        background: rgba(56, 139, 253, 0.35);
      }
      .btn-badge-action {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        border-radius: 4px;
        color: #fff;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 1px 6px;
        margin-left: 2px;
        cursor: pointer;
      }
      .btn-badge-action:active {
        background: rgba(255, 255, 255, 0.4);
      }
      .btn-logout {
        background: rgba(218, 54, 51, 0.2);
        border: 1px solid rgba(218, 54, 51, 0.5);
        color: #ff7b72;
        border-radius: 999px;
        padding: 3px 8px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-weight: 600;
        font-size: 0.72rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-logout:active {
        background: rgba(218, 54, 51, 0.4);
      }
      .btn-logout-footer {
        width: auto;
        height: 44px;
        border-radius: 12px;
        padding: 0 20px;
        gap: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        color: #ff7b72;
        background: rgba(218, 54, 51, 0.12);
        border: 1px solid rgba(218, 54, 51, 0.35);
        margin: 0 auto;
        cursor: pointer;
      }
      .btn-logout-footer:active {
        background: rgba(218, 54, 51, 0.3);
      }

      main {
        flex: 1;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      }

      .now-playing-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .media-type-tag {
        font-size: 0.7rem;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: 0.05em;
        padding: 3px 8px;
        border-radius: 6px;
        background: var(--primary-light);
        color: var(--primary-hover);
        border: 1px solid rgba(56, 139, 253, 0.3);
      }
      .media-title {
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.3;
        word-break: break-word;
        color: var(--text-main);
      }
      .now-playing-art-wrap {
        width: 100%;
        max-height: 220px;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--card-border);
      }
      .now-playing-art-wrap[hidden] {
        display: none !important;
      }
      .now-playing-art {
        width: 100%;
        height: auto;
        max-height: 220px;
        object-fit: contain;
        display: block;
      }
      .media-playback-state {
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      /* Scrubber slider */
      .scrubber-container {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .slider-track {
        position: relative;
        width: 100%;
        height: 28px;
        display: flex;
        align-items: center;
      }
      .slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 8px;
        border-radius: 4px;
        background: #21262d;
        outline: none;
        cursor: pointer;
      }
      .slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--primary-hover);
        box-shadow: 0 0 10px rgba(56, 139, 253, 0.5);
        border: 2px solid #ffffff;
        cursor: pointer;
        transition: transform 0.1s;
      }
      .slider:active::-webkit-slider-thumb {
        transform: scale(1.2);
      }
      .time-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
        color: var(--text-muted);
        font-weight: 600;
      }

      /* Transport Controls */
      .transport-bar {
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        gap: 12px;
        padding: 8px 0;
      }
      .btn-ctrl {
        background: #21262d;
        border: 1px solid var(--card-border);
        color: var(--text-main);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.15s ease;
        outline: none;
      }
      .btn-ctrl:active {
        transform: scale(0.92);
        background: #30363d;
      }
      .btn-ctrl svg {
        width: 24px;
        height: 24px;
        fill: currentColor;
      }
      .btn-play-pause {
        width: 68px;
        height: 68px;
        background: var(--primary);
        border: none;
        box-shadow: 0 4px 16px rgba(31, 111, 235, 0.4);
      }
      .btn-play-pause:active {
        background: var(--primary-hover);
      }
      .btn-play-pause svg {
        width: 32px;
        height: 32px;
      }
      .btn-play-pause .icon-pause {
        display: none !important;
      }
      .btn-play-pause .icon-play {
        display: block !important;
      }
      .btn-play-pause.is-playing .icon-play {
        display: none !important;
      }
      .btn-play-pause.is-playing .icon-pause {
        display: block !important;
      }
      .btn-blackout {
        border-radius: 12px;
        width: auto;
        padding: 0 16px;
        height: 48px;
        gap: 8px;
        font-weight: 600;
        font-size: 0.9rem;
      }

      /* Playlist Section */
      .playlist-card {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 250px;
        margin-bottom: var(--safe-bottom);
      }
      .playlist-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--card-border);
      }
      .playlist-title {
        font-size: 1rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .playlist-count {
        font-size: 0.8rem;
        color: var(--text-muted);
        background: #21262d;
        padding: 2px 8px;
        border-radius: 999px;
      }
      .btn-icon {
        background: #21262d;
        border: 1px solid var(--card-border);
        color: var(--text-muted);
        border-radius: 8px;
        width: 34px;
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-icon:hover {
        color: var(--text-main);
        border-color: var(--primary);
      }
      .btn-icon:active {
        transform: scale(0.92);
      }
      .btn-icon svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
      }
      .spinning {
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      .playlist-items {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        max-height: 72vh;
        padding-right: 4px;
      }
      .playlist-section {
        border: 1px solid var(--card-border);
        background: rgba(22, 27, 34, 0.4);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 6px;
      }
      .playlist-section-header {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-main);
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #161b22;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s;
      }
      .playlist-section-header:active {
        background: #21262d;
      }
      .section-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }
      .section-chevron {
        width: 16px;
        height: 16px;
        fill: currentColor;
        color: var(--text-muted);
        transition: transform 0.2s ease;
        flex-shrink: 0;
      }
      .playlist-section.collapsed .section-chevron {
        transform: rotate(-90deg);
      }
      .section-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0.82rem;
        color: #f0f6fc;
        font-weight: 700;
      }
      .section-count {
        font-size: 0.72rem;
        color: var(--text-muted);
        background: #0d1117;
        padding: 2px 7px;
        border-radius: 999px;
        margin-left: 6px;
        flex-shrink: 0;
      }
      .playlist-section-content {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid var(--card-border);
      }
      .playlist-section.collapsed .playlist-section-content {
        display: none !important;
      }

      .playlist-divider {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        margin: 2px 0;
        background: #1c2128;
        border-left: 3px solid #58a6ff;
        border-radius: 6px;
        font-weight: 700;
        font-size: 0.78rem;
        color: #c9d1d9;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        user-select: none;
      }
      .playlist-divider-icon {
        font-size: 0.85rem;
        opacity: 0.85;
        flex-shrink: 0;
      }
      .playlist-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: #0d1117;
        border: 1px solid var(--card-border);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        gap: 12px;
      }
      .playlist-item:active {
        transform: scale(0.98);
        background: #161b22;
      }
      .playlist-item.active {
        border-color: var(--primary);
        background: rgba(31, 111, 235, 0.12);
      }
      .playlist-thumb-wrap {
        width: 72px;
        height: 44px;
        border-radius: 6px;
        overflow: hidden;
        background: #161b22;
        border: 1px solid var(--card-border);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .playlist-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .playlist-thumb-fallback {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.25rem;
        background: linear-gradient(135deg, #21262d 0%, #161b22 100%);
        user-select: none;
      }
      .playlist-item-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        flex: 1;
      }
      .playlist-item-title-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .playlist-item-title {
        font-weight: 600;
        font-size: 0.92rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tag-song {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: rgba(163, 113, 247, 0.18);
        color: #d2a8ff;
        border: 1px solid rgba(163, 113, 247, 0.4);
        font-size: 0.72rem;
        font-weight: 700;
        padding: 1px 6px;
        border-radius: 6px;
        flex-shrink: 0;
      }
      .playlist-item-sub {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      .playlist-item.active .playlist-item-title {
        color: var(--primary-hover);
      }
      .status-playing-badge {
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 700;
        flex-shrink: 0;
      }

      /* PIN Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 20px;
      }
      .modal-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        padding: 24px;
        max-width: 360px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }
      .pin-input {
        width: 180px;
        height: 54px;
        text-align: center;
        font-size: 2rem;
        letter-spacing: 0.3em;
        font-weight: 700;
        background: #0d1117;
        border: 2px solid var(--card-border);
        color: var(--text-main);
        border-radius: 12px;
        outline: none;
        transition: border-color 0.2s;
      }
      .pin-input:focus {
        border-color: var(--primary);
      }
      .btn-submit {
        width: 100%;
        padding: 14px;
        background: var(--primary);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
      .btn-submit:active {
        background: var(--primary-hover);
      }
      .pin-error {
        color: var(--accent-red);
        font-size: 0.85rem;
        font-weight: 600;
        min-height: 20px;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div class="brand">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <rect width="512" height="512" rx="100" fill="#1f6feb" />
          <rect
            x="128"
            y="64"
            width="256"
            height="384"
            rx="36"
            fill="#161b22"
          />
          <polygon points="230,135 295,165 230,195" fill="#58a6ff" />
        </svg>
        <span>M³ Remote</span>
      </div>
      <div class="status-badges">
        <div id="controllerBadge" class="badge" title="Control status">
          <span
            id="controllerDot"
            class="badge-dot"
            style="background-color: #238636; box-shadow: 0 0 8px #238636"
          ></span>
          <span id="controllerBadgeText">In Control</span>
          <button
            id="btnTakeControl"
            class="btn-badge-action"
            type="button"
            hidden
          >
            Take Control
          </button>
        </div>
        <div
          id="zoomShareBadge"
          class="badge badge-zoom-share"
          title="Zoom Media Share Active - Click to stop sharing"
          hidden
        >
          <span
            class="badge-dot"
            style="background-color: #388bfd; box-shadow: 0 0 8px #388bfd"
          ></span>
          <span>Zoom Sharing</span>
          <button
            id="btnStopZoomShare"
            class="btn-badge-action"
            type="button"
            title="Stop sharing media in Zoom"
          >
            Stop
          </button>
        </div>
        <div
          id="blackoutBadge"
          class="badge badge-blackout visible"
          title="Toggle Blank Screen"
        >
          <span id="blackoutBadgeText">Screen ON</span>
        </div>
        <div id="connBadge" class="badge disconnected">
          <span class="badge-dot"></span>
          <span id="connBadgeText">Offline</span>
        </div>
        <button
          id="btnLogoutHeader"
          class="btn-logout"
          type="button"
          title="Log out from remote"
          aria-label="Log out"
          hidden
        >
          <svg
            viewBox="0 0 24 24"
            style="width: 13px; height: 13px; fill: currentColor"
          >
            <path
              d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
            />
          </svg>
          <span>Logout</span>
        </button>
      </div>
    </header>

    <!-- Toast Notification -->
    <div
      id="toastNotification"
      style="
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(218, 54, 51, 0.95);
        color: #fff;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        z-index: 2000;
        transition: opacity 0.3s ease;
        opacity: 0;
        pointer-events: none;
      "
      hidden
    ></div>

    <!-- Pairing Modal -->
    <div id="pinModal" class="modal-overlay" hidden>
      <div class="modal-card">
        <svg
          width="48"
          height="48"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#58a6ff"
          stroke-width="2"
        >
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
          <path d="M7 11V7a5 5 0 0 1 10 0v4" />
        </svg>
        <h2>Pairing Required</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem">
          Enter the 6-digit one-time code displayed on Meeting Media Manager
          desktop.
        </p>
        <input
          id="deviceNameInput"
          class="pin-input"
          style="
            width: 100%;
            height: 42px;
            font-size: 0.95rem;
            letter-spacing: normal;
            margin-bottom: 6px;
            text-align: left;
            padding: 0 12px;
          "
          type="text"
          maxlength="30"
          placeholder="Device Name (e.g. My Phone)"
        />
        <input
          id="pinInput"
          class="pin-input"
          type="tel"
          pattern="[0-9]*"
          inputmode="numeric"
          maxlength="6"
          placeholder="••••••"
        />
        <div id="pinError" class="pin-error"></div>
        <button id="pinSubmitBtn" class="btn-submit" type="button">
          Pair Device
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <main>
      <!-- Now Playing Card -->
      <div class="card">
        <div class="now-playing-header">
          <div>
            <span id="mediaTypeTag" class="media-type-tag">IDLE</span>
            <div
              id="mediaPlaybackState"

            >

            </div>
          </div>

        <div id="mediaArtContainer" class="now-playing-art-wrap" hidden>
          <img id="mediaArt" class="now-playing-art" src="" alt="" />
        </div>
        <div id="mediaTitle" class="media-title">Nothing playing</div>

        <!-- Scrubber -->
        <div class="scrubber-container">
          <div class="slider-track">
            <input
              id="seekBar"
              class="slider"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              disabled
            />
          </div>
          <div class="time-labels">
            <span id="currentTimeLabel">0:00</span>
            <span id="durationLabel">0:00</span>
          </div>
        </div>

        <!-- Transport Controls -->
        <div class="transport-bar">
          <button
            id="btnPrev"
            class="btn-ctrl"
            type="button"
            aria-label="Previous Item"
            title="Previous Item"
          >
            <svg viewBox="0 0 24 24">
              <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" />
            </svg>
          </button>
          <button
            id="btnPlayPause"
            class="btn-ctrl btn-play-pause"
            type="button"
            aria-label="Play / Pause"
            title="Play or Pause"
          >
            <svg id="iconPlay" class="icon-play" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg id="iconPause" class="icon-pause" viewBox="0 0 24 24" hidden>
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button
            id="btnStop"
            class="btn-ctrl"
            type="button"
            aria-label="Stop Media"
            title="Stop"
          >
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z" /></svg>
          </button>
          <button
            id="btnNext"
            class="btn-ctrl"
            type="button"
            aria-label="Next Item"
            title="Next Item"
          >
            <svg viewBox="0 0 24 24">
              <path d="m6 18 8.5-6L6 6v12zM16 6v12h2V6h-2z" />
            </svg>
          </button>
        </div>

        <!-- Blackout button -->
        <div style="display: flex; justify-content: center; margin-top: 4px">
          <button
            id="btnBlackoutToggle"
            class="btn-ctrl btn-blackout"
            type="button"
          >
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px">
              <path
                d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
              />
            </svg>
            <span id="blackoutBtnLabel">Blank Screen</span>
          </button>
        </div>
      </div>

      <!-- Playlist Card -->
      <div class="card playlist-card">
        <div class="playlist-header">
          <div class="playlist-title">
            <span>Today's Media Queue</span>
            <span id="playlistCount" class="playlist-count">0</span>
          </div>
          <button
            id="btnRefreshPlaylist"
            class="btn-icon"
            type="button"
            aria-label="Refresh Queue"
            title="Refresh Queue"
          >
            <svg id="iconRefresh" viewBox="0 0 24 24">
              <path
                d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
              />
            </svg>
          </button>
        </div>
        <div id="playlistItems" class="playlist-items">
          <div
            style="
              color: var(--text-muted);
              font-size: 0.9rem;
              text-align: center;
              padding: 24px 0;
            "
          >
            No items in queue
          </div>
        </div>
      </div>

      <!-- Footer Actions -->
      <div
        id="footerLogoutContainer"
        style="
          margin-top: 8px;
          margin-bottom: calc(var(--safe-bottom) + 16px);
          text-align: center;
        "
        hidden
      >
        <button
          id="btnFooterLogout"
          class="btn-ctrl btn-logout-footer"
          type="button"
        >
          <svg
            viewBox="0 0 24 24"
            style="width: 18px; height: 18px; fill: currentColor"
          >
            <path
              d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"
            />
          </svg>
          <span>Log Out & Disconnect</span>
        </button>
      </div>
    </main>

    <script>
      (function () {
        'use strict';

        // State
        let socket = null;
        let authenticated = false;
        let commandSeq = 0;
        let reconnectAttempts = 0;
        let reconnectTimer = null;
        let currentState = null;
        let isUserSeeking = false;
        let renderedPlaylistSignature = '';
        let lastActiveUniqueId = '';
        let isStoppingZoomShare = false;
        let toastTimer = null;

        const TOKEN_KEY = 'm3_remote_session_token';
        const DEVICE_KEY = 'm3_remote_device_name';
        let savedToken = localStorage.getItem(TOKEN_KEY) || '';

        // DOM Elements
        const connBadge = document.getElementById('connBadge');
        const connBadgeText = document.getElementById('connBadgeText');
        const controllerBadge = document.getElementById('controllerBadge');
        const controllerDot = document.getElementById('controllerDot');
        const controllerBadgeText = document.getElementById(
          'controllerBadgeText',
        );
        const btnTakeControl = document.getElementById('btnTakeControl');
        const toastNotification = document.getElementById('toastNotification');
        const blackoutBadge = document.getElementById('blackoutBadge');
        const blackoutBadgeText = document.getElementById('blackoutBadgeText');
        const zoomShareBadge = document.getElementById('zoomShareBadge');
        const btnStopZoomShare = document.getElementById('btnStopZoomShare');
        const pinModal = document.getElementById('pinModal');
        const deviceNameInput = document.getElementById('deviceNameInput');
        const pinInput = document.getElementById('pinInput');
        const pinError = document.getElementById('pinError');
        const pinSubmitBtn = document.getElementById('pinSubmitBtn');
        const btnLogoutHeader = document.getElementById('btnLogoutHeader');
        const btnFooterLogout = document.getElementById('btnFooterLogout');
        const footerLogoutContainer = document.getElementById(
          'footerLogoutContainer',
        );

        function getSuggestedDeviceName() {
          const ua = navigator.userAgent;
          if (/iPad/i.test(ua)) return 'iPad';
          if (/iPhone/i.test(ua)) return 'iPhone';
          if (/Android/i.test(ua)) return 'Android Device';
          if (/Macintosh/i.test(ua)) return 'Mac';
          if (/Windows/i.test(ua)) return 'Windows PC';
          return 'Mobile Device';
        }

        const savedDeviceName = localStorage.getItem(DEVICE_KEY);
        if (savedDeviceName && deviceNameInput) {
          deviceNameInput.value = savedDeviceName;
        } else if (deviceNameInput && !deviceNameInput.value) {
          deviceNameInput.value = getSuggestedDeviceName();
        }

        const mediaTypeTag = document.getElementById('mediaTypeTag');
        const mediaPlaybackState =
          document.getElementById('mediaPlaybackState');
        const mediaTitle = document.getElementById('mediaTitle');
        const mediaArtContainer = document.getElementById('mediaArtContainer');
        const mediaArt = document.getElementById('mediaArt');
        mediaArt.addEventListener('error', function () {
          mediaArtContainer.hidden = true;
        });
        mediaArt.addEventListener('load', function () {
          mediaArtContainer.hidden = false;
        });
        const seekBar = document.getElementById('seekBar');
        const currentTimeLabel = document.getElementById('currentTimeLabel');
        const durationLabel = document.getElementById('durationLabel');

        const btnPrev = document.getElementById('btnPrev');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const btnStop = document.getElementById('btnStop');
        const btnNext = document.getElementById('btnNext');
        const btnBlackoutToggle = document.getElementById('btnBlackoutToggle');
        const blackoutBtnLabel = document.getElementById('blackoutBtnLabel');

        const playlistCount = document.getElementById('playlistCount');
        const playlistItems = document.getElementById('playlistItems');
        const btnRefreshPlaylist =
          document.getElementById('btnRefreshPlaylist');
        const iconRefresh = document.getElementById('iconRefresh');

        const collapsedSections = new Set();
        let hasInitializedSectionFolding = false;

        function formatTime(seconds) {
          if (!seconds || isNaN(seconds) || seconds < 0) return '0:00';
          const sec = Math.floor(seconds);
          const mins = Math.floor(sec / 60);
          const remSecs = sec % 60;
          return `${mins}:${remSecs < 10 ? '0' : ''}${remSecs}`;
        }

        function vibrate() {
          if ('vibrate' in navigator) {
            try {
              navigator.vibrate(15);
            } catch (e) {}
          }
        }

        function updateConnectionStatus(status) {
          connBadge.className = 'badge ' + status;
          if (status === 'connected') {
            connBadgeText.textContent = 'Live';
          } else if (status === 'reconnecting') {
            connBadgeText.textContent = 'Connecting...';
          } else {
            connBadgeText.textContent = 'Offline';
          }
        }

        function showToast(msg) {
          if (!toastNotification) return;
          toastNotification.textContent = msg;
          toastNotification.hidden = false;
          toastNotification.style.opacity = '1';
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            toastNotification.style.opacity = '0';
            setTimeout(function () {
              toastNotification.hidden = true;
            }, 300);
          }, 3200);
        }

        function sendCommand(action) {
          vibrate();
          if (!socket || socket.readyState !== WebSocket.OPEN) return;
          if (currentState && currentState.controllerMode === 'viewer') {
            showToast(
              'You are in spectator mode. Tap "Take Control" above to control media.',
            );
            return;
          }
          commandSeq++;
          const cmdId =
            'cmd-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
          socket.send(
            JSON.stringify({
              action: action,
              id: cmdId,
              seq: commandSeq,
              type: 'action',
            }),
          );
        }

        function connect() {
          if (socket) {
            try {
              socket.close();
            } catch (e) {}
          }

          updateConnectionStatus('reconnecting');
          const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
          const wsUrl = `${proto}//${location.host}/ws`;

          socket = new WebSocket(wsUrl);

          socket.onopen = function () {
            reconnectAttempts = 0;
            savedToken = localStorage.getItem(TOKEN_KEY) || '';
            if (savedToken) {
              socket.send(JSON.stringify({ token: savedToken, type: 'auth' }));
            }
          };

          socket.onmessage = function (event) {
            try {
              const msg = JSON.parse(event.data);
              handleMessage(msg);
            } catch (e) {
              console.error('Invalid message from server', e);
            }
          };

          socket.onclose = function () {
            updateConnectionStatus('disconnected');
            authenticated = false;
            scheduleReconnect();
          };

          socket.onerror = function () {
            updateConnectionStatus('disconnected');
          };
        }

        function scheduleReconnect() {
          if (reconnectTimer) clearTimeout(reconnectTimer);
          const delay = Math.min(
            1000 * Math.pow(1.5, reconnectAttempts),
            10000,
          );
          reconnectAttempts++;
          reconnectTimer = setTimeout(connect, delay);
        }

        function handleMessage(msg) {
          switch (msg.type) {
            case 'auth_required':
              savedToken = localStorage.getItem(TOKEN_KEY) || '';
              if (savedToken) {
                socket.send(
                  JSON.stringify({ token: savedToken, type: 'auth' }),
                );
              } else {
                authenticated = false;
                if (btnLogoutHeader) btnLogoutHeader.hidden = true;
                if (footerLogoutContainer) footerLogoutContainer.hidden = true;
                pinModal.hidden = false;
                pinError.textContent = msg.message || '';
              }
              break;

            case 'auth_success':
              authenticated = true;
              if (msg.token) {
                savedToken = msg.token;
                localStorage.setItem(TOKEN_KEY, msg.token);
              }
              if (btnLogoutHeader) btnLogoutHeader.hidden = false;
              if (footerLogoutContainer) footerLogoutContainer.hidden = false;
              pinModal.hidden = true;
              pinError.textContent = '';
              updateConnectionStatus('connected');
              if (currentState) {
                renderState(currentState);
              }
              break;

            case 'auth_error':
              authenticated = false;
              if (btnLogoutHeader) btnLogoutHeader.hidden = true;
              if (footerLogoutContainer) footerLogoutContainer.hidden = true;
              pinModal.hidden = false;
              pinError.textContent = msg.message || 'Invalid pairing code';
              if (
                msg.message &&
                (msg.message.includes('revoked') ||
                  msg.message.includes('expired'))
              ) {
                localStorage.removeItem(TOKEN_KEY);
                savedToken = '';
              }
              break;

            case 'ack':
              if (!msg.success && msg.error) {
                showToast(msg.error);
              }
              break;

            case 'state_change':
              renderState(msg.data);
              break;
          }
        }

        function renderState(state) {
          if (!state) return;
          currentState = state;
          updateConnectionStatus('connected');

          // Controller status
          if (state.controllerMode === 'controller') {
            controllerBadge.className = 'badge';
            controllerDot.style.backgroundColor = '#238636';
            controllerDot.style.boxShadow = '0 0 8px #238636';
            controllerBadgeText.textContent = 'In Control';
            btnTakeControl.hidden = true;
          } else {
            controllerBadge.className = 'badge';
            controllerDot.style.backgroundColor = '#d29922';
            controllerDot.style.boxShadow = '0 0 8px #d29922';
            controllerBadgeText.textContent = state.activeControllerName
              ? 'By ' + state.activeControllerName
              : 'Spectator';
            btnTakeControl.hidden = false;
          }

          // Scope enforcement
          if (state.scope === 'partial') {
            blackoutBadge.hidden = true;
            btnBlackoutToggle.parentElement.hidden = true;
            zoomShareBadge.hidden = true;
          } else {
            blackoutBadge.hidden = false;
            btnBlackoutToggle.parentElement.hidden = false;
          }

          // Blackout / Window visibility
          const isScreenVisible = !!state.mediaWindowVisible;
          if (isScreenVisible) {
            blackoutBadge.className = 'badge badge-blackout visible';
            blackoutBadgeText.textContent = 'Screen ON';
            blackoutBtnLabel.textContent = 'Blank Screen';
          } else {
            blackoutBadge.className = 'badge badge-blackout active';
            blackoutBadgeText.textContent = 'BLACKOUT';
            blackoutBtnLabel.textContent = 'Show Screen';
          }

          // Zoom Sharing status
          if (
            state.scope !== 'partial' &&
            state.zoomSharing &&
            !isStoppingZoomShare
          ) {
            zoomShareBadge.hidden = false;
          } else {
            zoomShareBadge.hidden = true;
          }

          // Title and media type
          mediaTitle.textContent = state.title || 'Nothing playing';
          mediaTypeTag.textContent = (state.mediaType || 'IDLE').toUpperCase();

          // Playback state
          if (state.isPlaying) {
            mediaPlaybackState.textContent = 'Playing';
            btnPlayPause.classList.add('is-playing');
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
          } else if (state.isPaused) {
            mediaPlaybackState.textContent = 'Paused';
            btnPlayPause.classList.remove('is-playing');
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
          } else {
            mediaPlaybackState.textContent = 'Stopped';
            btnPlayPause.classList.remove('is-playing');
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
          }

          // Artwork display
          if (state.thumbnailUrl && (state.isPlaying || state.isPaused)) {
            let artSrc = state.thumbnailUrl;
            if (artSrc.indexOf('/api/thumbnail') !== -1 && savedToken) {
              artSrc += '&token=' + encodeURIComponent(savedToken);
            }
            if (mediaArt.getAttribute('data-src') !== artSrc) {
              mediaArt.setAttribute('data-src', artSrc);
              mediaArt.src = artSrc;
            }
          } else {
            mediaArt.removeAttribute('data-src');
            mediaArt.src = '';
            mediaArtContainer.hidden = true;
          }

          // Seek slider
          const duration = state.duration || 0;
          const currentPos = state.currentPosition || 0;

          if (!isUserSeeking) {
            seekBar.max = duration > 0 ? duration : 100;
            seekBar.value = currentPos;
            seekBar.disabled = duration <= 0;
            currentTimeLabel.textContent = formatTime(currentPos);
            durationLabel.textContent = formatTime(duration);
          }

          // Playlist
          renderPlaylist(state.playlist || [], state.uniqueId);
        }

        function createPlaylistItemElement(item, isActive) {
          const el = document.createElement('div');
          el.className = 'playlist-item' + (isActive ? ' active' : '');
          el.setAttribute('data-unique-id', item.uniqueId);

          const typeTag = item.isVideo
            ? 'Video'
            : item.isAudio
              ? 'Audio'
              : item.isImage
                ? 'Image'
                : 'Media';
          const typeIcon = item.isAudio
            ? '🎵'
            : item.isVideo
              ? '🎬'
              : item.isImage
                ? '🖼️'
                : '▶️';
          const durationStr = item.duration ? formatTime(item.duration) : '';
          const songTag = item.songNumber
            ? `<span class="tag-song">🎵 #${escapeHtml(String(item.songNumber))}</span>`
            : '';

          let thumbHtml = '';
          if (item.thumbnailUrl) {
            let itemThumbSrc = item.thumbnailUrl;
            if (itemThumbSrc.indexOf('/api/thumbnail') !== -1 && savedToken) {
              itemThumbSrc += '&token=' + encodeURIComponent(savedToken);
            }
            thumbHtml = `
              <div class="playlist-thumb-wrap">
                <img class="playlist-thumb" src="${escapeHtml(itemThumbSrc)}" loading="lazy" alt="" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';" />
                <div class="playlist-thumb-fallback" style="display:none;">${typeIcon}</div>
              </div>`;
          } else {
            thumbHtml = `
              <div class="playlist-thumb-wrap">
                <div class="playlist-thumb-fallback">${typeIcon}</div>
              </div>`;
          }

          el.innerHTML = `
          ${thumbHtml}
          <div class="playlist-item-info">
            <div class="playlist-item-title-row">
              ${songTag}
              <span class="playlist-item-title">${escapeHtml(item.title || 'Untitled')}</span>
            </div>
            <div class="playlist-item-sub">
              <span>${typeTag}</span>
              ${durationStr ? `<span>•</span><span>${durationStr}</span>` : ''}
            </div>
          </div>
          ${isActive ? '<span class="status-playing-badge">PLAYING</span>' : ''}
        `;

          el.addEventListener('click', function () {
            lastActiveUniqueId = item.uniqueId;
            if (currentState) {
              currentState.isPlaying = true;
              currentState.isPaused = false;
              currentState.uniqueId = item.uniqueId;
              btnPlayPause.classList.add('is-playing');
              iconPlay.style.display = 'none';
              iconPause.style.display = 'block';
              mediaPlaybackState.textContent = 'Playing';
              mediaTitle.textContent = item.title || 'Playing';
            }
            sendCommand({
              type: 'select_item',
              uniqueId: item.uniqueId,
              play: true,
            });
          });

          return el;
        }

        function renderPlaylist(playlist, activeUniqueId) {
          const playableItems = (playlist || []).filter(function (it) {
            return !it.isDivider;
          });
          playlistCount.textContent = playableItems.length.toString();

          if (!playlist || playlist.length === 0) {
            renderedPlaylistSignature = '';
            lastActiveUniqueId = '';
            playlistItems.innerHTML =
              '<div style="color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 24px 0;">No items in queue</div>';
            return;
          }

          const currentSignature =
            playlist
              .map(function (it) {
                return (
                  (it.uniqueId || '') +
                  ':' +
                  (it.title || '') +
                  ':' +
                  (it.isDivider ? '1' : '0') +
                  ':' +
                  (it.groupId || '') +
                  ':' +
                  (it.groupTitle || '') +
                  ':' +
                  (it.sectionId || it.section || '') +
                  ':' +
                  (it.thumbnailUrl || '')
                );
              })
              .join('|') +
            ':' +
            (savedToken ? 'auth' : 'noauth');

          // If the playlist structure hasn't changed, only update active styling without re-rendering DOM
          if (currentSignature === renderedPlaylistSignature) {
            if (activeUniqueId !== lastActiveUniqueId) {
              lastActiveUniqueId = activeUniqueId;
              const allItems = playlistItems.querySelectorAll('.playlist-item');
              allItems.forEach(function (el) {
                const uid = el.getAttribute('data-unique-id');
                const isNowActive = uid && uid === activeUniqueId;
                if (isNowActive) {
                  el.classList.add('active');
                  if (!el.querySelector('.status-playing-badge')) {
                    const badge = document.createElement('span');
                    badge.className = 'status-playing-badge';
                    badge.textContent = 'PLAYING';
                    el.appendChild(badge);
                  }
                  // Auto-uncollapse parent section if newly active
                  let parent = el.parentElement;
                  while (parent && parent !== playlistItems) {
                    if (parent.classList.contains('playlist-section')) {
                      parent.classList.remove('collapsed');
                      const sKey = parent.getAttribute('data-section-key');
                      if (sKey) collapsedSections.delete(sKey);
                    }
                    parent = parent.parentElement;
                  }
                } else {
                  el.classList.remove('active');
                  const badge = el.querySelector('.status-playing-badge');
                  if (badge) badge.remove();
                }
              });
            }
            return;
          }

          renderedPlaylistSignature = currentSignature;

          // If the active item changed to a new item, auto-expand its section
          if (activeUniqueId) {
            playlist.forEach(function (it) {
              if (it.uniqueId === activeUniqueId) {
                const secKey = it.sectionId || it.section;
                if (secKey) collapsedSections.delete(secKey);
              }
            });
          }
          lastActiveUniqueId = activeUniqueId;

          playlistItems.innerHTML = '';

          // Group items by section
          const sectionsMap = new Map();
          playlist.forEach(function (item) {
            const secKey = item.sectionId || item.section || 'General';
            const secTitle = item.section || 'General';
            if (!sectionsMap.has(secKey)) {
              sectionsMap.set(secKey, { items: [], title: secTitle });
            }
            sectionsMap.get(secKey).items.push(item);
          });

          // On initial playlist render with multiple sections:
          // Keep only the active section (or first section) open, collapse the others!
          if (!hasInitializedSectionFolding && sectionsMap.size > 1) {
            hasInitializedSectionFolding = true;
            let activeSecKey = null;
            if (activeUniqueId) {
              sectionsMap.forEach(function (data, key) {
                if (
                  data.items.some(function (it) {
                    return it.uniqueId === activeUniqueId;
                  })
                ) {
                  activeSecKey = key;
                }
              });
            }
            if (!activeSecKey) {
              activeSecKey = sectionsMap.keys().next().value;
            }
            sectionsMap.forEach(function (_, key) {
              if (key !== activeSecKey) {
                collapsedSections.add(key);
              }
            });
          }

          sectionsMap.forEach(function (secData, secKey) {
            const secPlayableCount = secData.items.filter(function (i) {
              return !i.isDivider;
            }).length;

            const sectionContainer = document.createElement('div');
            const isSectionCollapsed = collapsedSections.has(secKey);
            sectionContainer.className =
              'playlist-section' + (isSectionCollapsed ? ' collapsed' : '');
            sectionContainer.setAttribute('data-section-key', secKey);

            const sectionHeader = document.createElement('div');
            sectionHeader.className = 'playlist-section-header';
            sectionHeader.innerHTML = `
            <div class="section-title-row">
              <svg class="section-chevron" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
              <span class="section-title">${escapeHtml(secData.title)}</span>
              <span class="section-count">${secPlayableCount}</span>
            </div>
          `;

            sectionHeader.addEventListener('click', function () {
              if (collapsedSections.has(secKey)) {
                collapsedSections.delete(secKey);
                sectionContainer.classList.remove('collapsed');
              } else {
                collapsedSections.add(secKey);
                sectionContainer.classList.add('collapsed');
              }
            });

            const sectionContent = document.createElement('div');
            sectionContent.className = 'playlist-section-content';

            secData.items.forEach(function (item) {
              // Divider
              if (item.isDivider) {
                const divEl = document.createElement('div');
                divEl.className = 'playlist-divider';
                divEl.innerHTML = `
                <span class="playlist-divider-icon">🏷️</span>
                <span>${escapeHtml(item.title || 'Divider')}</span>
              `;
                sectionContent.appendChild(divEl);
                return;
              }

              const isActive = item.uniqueId === activeUniqueId;
              const el = createPlaylistItemElement(item, isActive);
              sectionContent.appendChild(el);
            });

            sectionContainer.appendChild(sectionHeader);
            sectionContainer.appendChild(sectionContent);
            playlistItems.appendChild(sectionContainer);
          });
        }

        function escapeHtml(text) {
          if (!text) return '';
          const div = document.createElement('div');
          div.textContent = text;
          return div.innerHTML;
        }

        // Event Listeners for Controls with optimistic UI feedback
        btnPlayPause.addEventListener('click', function () {
          if (!currentState) {
            sendCommand({ type: 'play' });
            return;
          }
          if (currentState.isPlaying) {
            currentState.isPlaying = false;
            currentState.isPaused = true;
            btnPlayPause.classList.remove('is-playing');
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
            mediaPlaybackState.textContent = 'Paused';
            sendCommand({ type: 'pause' });
          } else {
            currentState.isPlaying = true;
            currentState.isPaused = false;
            btnPlayPause.classList.add('is-playing');
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
            mediaPlaybackState.textContent = 'Playing';
            sendCommand({ type: 'play' });
          }
        });

        btnStop.addEventListener('click', function () {
          if (currentState) {
            currentState.isPlaying = false;
            currentState.isPaused = false;
            currentState.isStopped = true;
            btnPlayPause.classList.remove('is-playing');
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
            mediaPlaybackState.textContent = 'Stopped';
          }
          sendCommand({ type: 'stop' });
        });

        btnRefreshPlaylist.addEventListener('click', function () {
          iconRefresh.classList.add('spinning');
          setTimeout(function () {
            iconRefresh.classList.remove('spinning');
          }, 700);
          sendCommand({ type: 'refresh_playlist' });
        });

        btnPrev.addEventListener('click', function () {
          sendCommand({ type: 'previous' });
        });
        btnNext.addEventListener('click', function () {
          sendCommand({ type: 'next' });
        });
        btnBlackoutToggle.addEventListener('click', function () {
          sendCommand({ type: 'toggle_blackout' });
        });
        blackoutBadge.addEventListener('click', function () {
          sendCommand({ type: 'toggle_blackout' });
        });
        function stopZoomShare() {
          isStoppingZoomShare = true;
          zoomShareBadge.hidden = true;
          sendCommand({ type: 'stop_zoom_share' });
          setTimeout(function () {
            isStoppingZoomShare = false;
          }, 3500);
        }

        zoomShareBadge.addEventListener('click', stopZoomShare);
        btnStopZoomShare.addEventListener('click', function (e) {
          e.stopPropagation();
          stopZoomShare();
        });

        // Seek Slider interaction
        seekBar.addEventListener('input', function () {
          isUserSeeking = true;
          currentTimeLabel.textContent = formatTime(Number(seekBar.value));
        });

        seekBar.addEventListener('change', function () {
          const targetPos = Number(seekBar.value);
          sendCommand({ type: 'seek', position: targetPos });
          setTimeout(function () {
            isUserSeeking = false;
          }, 300);
        });

        // Take Control button
        if (btnTakeControl) {
          btnTakeControl.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!socket || socket.readyState !== WebSocket.OPEN) return;
            commandSeq++;
            const cmdId =
              'cmd-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
            socket.send(
              JSON.stringify({
                id: cmdId,
                seq: commandSeq,
                type: 'take_control',
              }),
            );
          });
        }

        // Pairing submission
        function submitPairing() {
          const code = pinInput.value.trim();
          const devName =
            (deviceNameInput.value || '').trim() || 'Mobile Device';
          if (!code || code.length < 6) {
            pinError.textContent = 'Please enter the 6-digit pairing code';
            return;
          }
          localStorage.setItem(DEVICE_KEY, devName);
          if (socket && socket.readyState === WebSocket.OPEN) {
            socket.send(
              JSON.stringify({ code: code, deviceName: devName, type: 'pair' }),
            );
          } else {
            connect();
          }
        }

        pinSubmitBtn.addEventListener('click', submitPairing);
        pinInput.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') submitPairing();
        });
        if (deviceNameInput) {
          deviceNameInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') pinInput.focus();
          });
        }

        function performLogout() {
          if (
            confirm('Disconnect and log out this device from remote control?')
          ) {
            if (socket && socket.readyState === WebSocket.OPEN) {
              try {
                socket.send(JSON.stringify({ type: 'logout' }));
              } catch (e) {}
            }
            localStorage.removeItem(TOKEN_KEY);
            savedToken = '';
            authenticated = false;
            currentState = null;
            if (btnLogoutHeader) btnLogoutHeader.hidden = true;
            if (footerLogoutContainer) footerLogoutContainer.hidden = true;
            updateConnectionStatus('disconnected');
            pinModal.hidden = false;
            pinInput.value = '';
            pinError.textContent = '';
            showToast('Logged out successfully');
          }
        }

        if (btnLogoutHeader) {
          btnLogoutHeader.addEventListener('click', performLogout);
        }
        if (btnFooterLogout) {
          btnFooterLogout.addEventListener('click', performLogout);
        }

        // Start initial connection
        connect();
      })();
    </script>
  </body>
</html>
